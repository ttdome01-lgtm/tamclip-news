name: Collect news

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # GitHub often runs late or skips, off-peak minutes help
  workflow_dispatch:

permissions:
  contents: write

# GitHub's schedule really fires about once an hour or less, so one run covers 2 hours and the next waits its turn.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and publish every 15 minutes for about 2 hours
        run: |
          git config user.name "news-collector"
          git config user.email "news-collector@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase origin main || true
            python collect.py data || true
            ls -1 data/news-*.json | sort -r | tail -n +401 | xargs -r git rm -q --ignore-unmatch -f
            git add data
            git diff --cached --quiet || { git commit -qm "Update news $(date -u +%FT%H:%M)" && git push -q origin main || true; }
            [ "$i" = 8 ] || sleep 870
          done
