name: Collect news

on:
  schedule:
    - cron: "5,35 * * * *"  # the second run fills in when GitHub skips the first
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py data
      - name: Keep the newest 72 files
        run: ls -1 data/news-*.json | sort -r | tail -n +73 | xargs -r git rm -q --ignore-unmatch -f
      - name: Commit
        run: |
          git config user.name "news-collector"
          git config user.email "news-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update news $(date -u +%FT%H)"
          git push
